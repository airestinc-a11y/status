owner: airestinc-a11y
repo: status

sites:
  - name: Website
    url: https://airest.ai
  - name: App
    url: https://app.airest.ai/login
  - name: Messaging engine
    slug: messaging-engine
    url: https://app.airest.ai/api/health
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  - name: WhatsApp message receiver
    slug: whatsapp
    url: https://inbox.airest.ai/webhooks/whatsapp/status-check
    expectedStatusCodes:
      - 401
  - name: Instagram message receiver
    slug: instagram
    url: https://inbox.airest.ai/webhooks/instagram
    expectedStatusCodes:
      - 401
  - name: Messenger message receiver
    slug: messenger
    url: https://inbox.airest.ai/bot
  - name: Website chat script
    slug: website-chat
    url: https://inbox.airest.ai/packs/js/sdk.js

status-website:
  cname: status.airest.ai
  logoUrl: https://raw.githubusercontent.com/airestinc-a11y/status/master/assets/airest-icon.png
  name: Airest Status
  introTitle: "**Airest** service status"
  introMessage: Availability of the Airest website, app, messaging engine and message receivers, checked automatically several times a day. A receiver being up means it is ready to accept messages from that channel; it does not show whether a given company has connected the channel.
  navbar:
    - title: Status
      href: /
    - title: Airest
      href: https://airest.ai
    - title: Security
      href: https://airest.ai/security
